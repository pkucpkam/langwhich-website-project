spring:
  application:
    name: langwhich-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/langwhich_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItbGFuZ3doaWNoLXRvZWljLXBsYXRmb3JtLW11c3QtYmUtbG9uZy1lbm91Z2g=}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}       # 15 minutes
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.langwhich: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
